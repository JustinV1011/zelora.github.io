<!DOCTYPE html>
<html lang="en" data-font="m" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2f33">
<meta name="description" content="ZELORA — accessible personal finance research prototype">
<title>ZELORA</title>
<style>
/* =========================================================
   ZELORA — design tokens
   All sizes use rem so the Text size setting scales everything.
   ========================================================= */
:root{
  --bg:#eef3f6; --panel:#ffffff; --soft:#f2f6f8; --soft-2:#e7eef1;
  --ink:#0f2a2e; --muted:#46585d; --line:#cfdbe0; --line-strong:#9fb3ba;
  --brand:#1ba9a0; --brand-2:#38c7b8;            /* decorative teal (fills, charts) */
  --accent:#0b766f; --accent-ink:#ffffff;          /* text-safe teal: 5.3:1 on white */
  --navy:#0f2f33; --navy-ink:#ffffff;
  --btn:#0f2f33; --btn-ink:#ffffff; --btn-hover:#0b766f;
  --pos:#05704f; --neg:#b42318; --warn:#7a4d00;
  --pos-bg:#e3f5ec; --neg-bg:#fdecea; --warn-bg:#fff3d1; --info-bg:#e5f3f2;
  --chart-in:#1ba9a0; --chart-out:#e0743f;
  --focus:#1d4ed8;
  --radius:1.25rem; --radius-sm:.85rem;
  --shadow:0 .5rem 1.75rem rgba(15,42,46,.07);
  --hero-a:#0e2b3a; --hero-b:#1d8f9b;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0a1719; --panel:#11252a; --soft:#173136; --soft-2:#1d3a40;
  --ink:#e9f3f4; --muted:#b2c6ca; --line:#2b4a50; --line-strong:#4f7178;
  --accent:#4fd1c5; --accent-ink:#06201f;
  --btn:#4fd1c5; --btn-ink:#06201f; --btn-hover:#8be5dc;
  --navy:#4fd1c5; --navy-ink:#06201f;
  --pos:#5fe0aa; --neg:#ff8a80; --warn:#ffd27a;
  --pos-bg:#123d2e; --neg-bg:#47201d; --warn-bg:#3d3112; --info-bg:#14363a;
  --chart-in:#4fd1c5; --chart-out:#ff9d6c;
  --focus:#93c5fd;
  --shadow:0 .5rem 1.75rem rgba(0,0,0,.35);
  --hero-a:#0b2229; --hero-b:#13707a;
  color-scheme:dark;
}
[data-contrast="high"]{
  --bg:#ffffff; --panel:#ffffff; --soft:#ffffff; --soft-2:#f0f0f0;
  --ink:#000000; --muted:#1a1a1a; --line:#000000; --line-strong:#000000;
  --accent:#00524d; --btn:#000000; --btn-ink:#ffffff; --btn-hover:#00524d; --navy:#000000;
  --pos:#00512f; --neg:#9b0000; --warn:#5c3a00; --brand:#00524d;
  --chart-in:#00524d; --chart-out:#a33a00; --focus:#0000ee;
  --shadow:none; --hero-a:#000000; --hero-b:#00332f;
}
[data-theme="dark"][data-contrast="high"]{
  --bg:#000000; --panel:#000000; --soft:#000000; --soft-2:#1a1a1a;
  --ink:#ffffff; --muted:#f0f0f0; --line:#ffffff; --line-strong:#ffffff;
  --accent:#7ff5ea; --accent-ink:#000; --btn:#ffff00; --btn-ink:#000000; --btn-hover:#ffffff; --navy:#ffff00; --navy-ink:#000;
  --pos:#7dffb8; --neg:#ff9b9b; --warn:#ffe066; --brand:#7ff5ea;
  --chart-in:#7ff5ea; --chart-out:#ffb347; --focus:#ffff00; --hero-a:#000; --hero-b:#000;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-font="s"]{font-size:14.5px}
html[data-font="l"]{font-size:19px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
img,svg{display:block}
.ico{display:inline-block;vertical-align:middle;flex-shrink:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:.5rem}
[data-contrast="high"] .panel,[data-contrast="high"] .dialog{border:2px solid var(--line)}
[data-contrast="high"] a,[data-contrast="high"] .link{text-decoration:underline}
[data-motion="reduce"] *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:1rem;top:-5rem;z-index:300;background:var(--btn);color:var(--btn-ink);padding:.75rem 1.25rem;border-radius:.75rem;font-weight:700;text-decoration:none}
.skip:focus{top:1rem}
.muted{color:var(--muted)}
h1,h2,h3{line-height:1.25;letter-spacing:-.01em}

/* ---------- Layout shell ---------- */
.shell{display:grid;grid-template-columns:16rem minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1.25rem .85rem;gap:.5rem;overflow-y:auto}
.brand{display:flex;align-items:center;gap:.65rem;font-weight:800;font-size:1.4rem;letter-spacing:.04em;padding:.25rem .6rem 1rem}
.logo-mark{display:block;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--navy);position:relative;flex-shrink:0}
[data-theme="dark"] .logo-mark{background:#0f2f33;box-shadow:0 0 0 2px var(--accent)}
.logo-mark::after{content:"";position:absolute;width:.85rem;height:.85rem;border-radius:50%;background:var(--brand-2);left:.38rem;bottom:.38rem}
.nav{list-style:none;display:flex;flex-direction:column;gap:.25rem}
.nav a,.nav-btn{display:flex;align-items:center;gap:.85rem;min-height:3rem;padding:.6rem .9rem;border-radius:.9rem;color:var(--ink);text-decoration:none;font-weight:600;border:2px solid transparent;background:none;cursor:pointer;width:100%;text-align:left}
.nav a:hover,.nav-btn:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--navy);color:var(--navy-ink)}
.nav a.tour-hl,.bn-item.tour-hl{outline:3px solid var(--brand);outline-offset:2px;background:var(--info-bg);color:var(--ink)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:.75rem}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.75rem;padding:1rem 2rem;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.topbar h1{font-size:1.6rem;outline:none;margin-right:auto}
.m-brand{display:none}
.top-actions{display:flex;align-items:center;gap:.5rem}
.save-state{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.3rem;white-space:nowrap}
.save-state.bad{color:var(--neg);font-weight:600}
.content{padding:.25rem 2rem 2rem;width:100%;max-width:82rem;outline:none}
.foot-note{display:flex;gap:.5rem;align-items:center;padding:1rem 2rem 1.5rem;font-size:.85rem;color:var(--muted)}
.bottom-nav{display:none}

/* ---------- Generic controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.65rem 1.3rem;border-radius:999px;border:2px solid transparent;font-weight:700;cursor:pointer;background:var(--btn);color:var(--btn-ink);text-decoration:none;transition:background .15s,transform .1s;line-height:1.2;text-align:center}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--btn)}
[data-theme="dark"] .btn.primary:hover{background:var(--btn-hover)}
.btn.secondary{background:var(--panel);color:var(--ink);border-color:var(--line-strong)}
.btn.secondary:hover{background:var(--soft)}
.btn.ghost{background:transparent;color:var(--accent);border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--neg);color:#fff}
[data-theme="dark"] .btn.danger{color:#2a0603}
.btn.block{width:100%}
.btn.sm{min-height:2.6rem;padding:.4rem 1rem;font-size:.9rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;transform:none}
.icon-btn{width:3rem;height:3rem;border-radius:50%;border:2px solid transparent;background:var(--panel);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);position:relative;box-shadow:var(--shadow);flex-shrink:0}
.icon-btn:hover{background:var(--soft);border-color:var(--line)}
.icon-btn.sm{width:2.75rem;height:2.75rem;box-shadow:none;background:var(--soft)}
.icon-btn[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.icon-btn .count{position:absolute;top:-.2rem;right:-.2rem;min-width:1.35rem;height:1.35rem;padding:0 .3rem;border-radius:999px;background:var(--neg);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel)}
.avatar{width:3rem;height:3rem;border-radius:50%;border:2px solid var(--line);background:var(--accent);color:var(--accent-ink);font-weight:800;cursor:pointer;flex-shrink:0}
.cur-select{min-height:3rem;border-radius:999px;border:2px solid var(--line);background:var(--panel);padding:0 .9rem;font-weight:700;cursor:pointer}
.link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;gap:.3rem;min-height:2.75rem;padding:0 .25rem}
.link:hover{text-decoration-thickness:2px}

/* forms */
.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.1rem}
.field>label,.legend,legend{font-weight:700;font-size:.95rem}
.help{font-size:.88rem;color:var(--muted)}
.input,select.input,textarea.input{min-height:3rem;border:2px solid var(--line-strong);border-radius:var(--radius-sm);padding:.6rem .9rem;background:var(--panel);width:100%}
.input:focus{border-color:var(--accent)}
.input[aria-invalid="true"],.input-group[data-invalid="true"]{border-color:var(--neg)}
.input-group{display:flex;align-items:center;border:2px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);min-height:3rem;padding-left:.9rem}
.input-group:focus-within{border-color:var(--accent);outline:3px solid var(--focus);outline-offset:2px}
.input-group input{border:0;background:transparent;min-height:2.8rem;padding:.5rem .9rem .5rem .5rem;width:100%;outline:none;min-width:0}
.input-group .prefix{font-weight:800;color:var(--muted)}
.input-group .suffix-btn{border:0;background:none;min-width:3rem;min-height:2.8rem;cursor:pointer;color:var(--muted);display:grid;place-items:center;border-radius:.6rem}
.input-group .suffix-btn:hover{color:var(--ink)}
.err{color:var(--neg);font-weight:700;font-size:.9rem;display:flex;gap:.4rem;align-items:flex-start}
.err[hidden]{display:none}
.err .ico{margin-top:.15rem}
fieldset{border:0;min-width:0}
legend{margin-bottom:.5rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:flex-end;margin-top:1.25rem}
.actions.start{justify-content:flex-start}
.actions .btn{flex:0 1 auto}

/* segmented radio / toggle chips */
.seg{display:inline-flex;flex-wrap:wrap;gap:.35rem;background:var(--soft);padding:.3rem;border-radius:999px;border:1px solid var(--line)}
.seg button,.seg label{min-height:2.6rem;padding:.4rem 1rem;border-radius:999px;border:0;background:transparent;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;color:var(--ink)}
.seg button[aria-pressed="true"],.seg input:checked+span{background:var(--navy);color:var(--navy-ink)}
.seg label{padding:0;position:relative}
.seg label span{display:inline-flex;align-items:center;gap:.4rem;min-height:2.6rem;padding:.4rem 1rem;border-radius:999px}
.seg input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip-btn{min-height:2.75rem;padding:.4rem 1rem;border-radius:999px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:.45rem}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}

/* switch (real checkbox) */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row .txt{display:flex;flex-direction:column;gap:.15rem}
.switch-row .txt strong{font-weight:700}
.switch{appearance:none;-webkit-appearance:none;width:3.4rem;height:2rem;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;border:2px solid transparent}
.switch::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.45rem;height:1.45rem;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(1.4rem)}
[data-contrast="high"] .switch{border-color:var(--ink)}

/* ---------- Panels ---------- */
.panel{background:var(--panel);border-radius:var(--radius);padding:1.4rem;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.panel-head h2{font-size:1.15rem;display:flex;align-items:center;gap:.4rem}
.panel-head h3{font-size:1.05rem}
.page-intro{color:var(--muted);margin:0 0 1.25rem;max-width:48rem;font-size:1.02rem}
.stack{display:flex;flex-direction:column;gap:1.25rem}
.greet{font-size:1.1rem;margin-bottom:1.1rem}
.badge-proto{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:700;padding:.25rem .65rem;border-radius:999px;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert{display:flex;gap:.75rem;align-items:flex-start;padding:1rem 1.1rem;border-radius:var(--radius-sm);background:var(--info-bg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);margin-bottom:1.25rem}
.alert.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink)}
.alert.warn>.ico{color:var(--warn)}
.alert.err-box{background:var(--neg-bg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.alert.err-box>.ico{color:var(--neg)}
.alert.ok{background:var(--pos-bg);border-color:color-mix(in srgb,var(--pos) 40%,transparent)}
.alert>.ico{color:var(--accent);margin-top:.15rem}
.alert p+p{margin-top:.35rem}

/* home grid */
.home-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1.25rem;align-items:start}
.w7{grid-column:span 7}.w5{grid-column:span 5}.w6{grid-column:span 6}.w12{grid-column:1/-1}.w4{grid-column:span 4}.w8{grid-column:span 8}

/* home two-column layout (collapses to priority order on small screens) */
.home-cols{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:1.25rem;align-items:start}
.hc{display:flex;flex-direction:column;gap:1.25rem;min-width:0}
@media (max-width:1240px){.home-cols{display:flex;flex-direction:column;align-items:stretch}.hc{display:contents}}
/* hero balance */
.hero{background:radial-gradient(circle at 85% 90%,var(--hero-b) 0%,var(--hero-a) 60%);color:#fff;position:relative;overflow:hidden;border:0}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);mask:radial-gradient(ellipse at 85% 80%,#000 10%,transparent 65%);pointer-events:none}
.hero>*{position:relative}
.hero-row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.hero-lbl{font-size:1.05rem;font-weight:600;color:#e3f1f2}
.hero-amt{font-size:clamp(2.2rem,5vw,3.3rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:.35rem 0 .3rem;word-break:break-word}
.hero-sub{color:#d6e8ea;margin-bottom:1.25rem}
.hero .info{color:#fff}
.hero .eye{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border-color:rgba(255,255,255,.25)}
.hero .eye:hover{background:rgba(255,255,255,.22)}
.qa-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.65rem}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;min-height:5.2rem;padding:.7rem .4rem;border-radius:1rem;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:.92rem;cursor:pointer;text-align:center;line-height:1.2}
.qa:hover{background:rgba(255,255,255,.2)}
.qa-ico{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0f2f33}
[data-contrast="high"] .hero{border:2px solid var(--line)}
[data-contrast="high"] .qa{border-color:#fff}

/* summary */
.month-nav{display:inline-flex;align-items:center;gap:.35rem}
.month-btn{min-height:2.75rem;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:.3rem 1rem;font-weight:700;display:inline-flex;align-items:center;gap:.45rem;cursor:pointer}
.month-btn:hover{border-color:var(--accent)}
.sum-list{list-style:none;display:flex;flex-direction:column;gap:.85rem}
.sum{display:flex;align-items:center;gap:.9rem;padding:.85rem;border-radius:1rem;background:var(--soft)}
.sum .badge{width:2.75rem;height:2.75rem}
.sum-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.sum-lbl{font-weight:600;display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.sum-val{font-size:1.4rem;font-weight:800;line-height:1.2}
.cmp{font-size:.85rem;color:var(--muted)}
.sum svg.spark{width:5.5rem;height:2.6rem;flex-shrink:0}
.link-row{display:flex;justify-content:flex-end;margin-top:.75rem}

/* tooltip / info */
.tipwrap{position:relative;display:inline-flex}
.info{width:2.75rem;height:2.75rem;margin:-.6rem -.4rem;border:0;background:none;color:var(--accent);cursor:pointer;display:grid;place-items:center;border-radius:50%}
.info:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.bubble{position:absolute;z-index:40;top:calc(100% + .25rem);left:50%;transform:translateX(-50%);width:max-content;max-width:min(19rem,80vw);background:var(--navy);color:var(--navy-ink);padding:.75rem .9rem;border-radius:.8rem;font-size:.9rem;font-weight:500;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:left}
[data-theme="dark"] .bubble{background:#e9f3f4;color:#06201f}
.bubble[hidden]{display:none}
.bubble strong{display:block;margin-bottom:.15rem}
.hide-tips .tipwrap{display:none}

/* badges & rows */
.badge{width:2.6rem;height:2.6rem;border-radius:.85rem;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--c) 15%,var(--panel));color:color-mix(in srgb,var(--c) 75%,var(--ink))}
[data-contrast="high"] .badge{background:var(--panel);color:var(--ink);border:2px solid var(--ink)}
.tx-list{list-style:none;display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:.85rem;width:100%;padding:.7rem .6rem;border:0;background:none;text-align:left;cursor:pointer;border-radius:.9rem;min-height:3.75rem}
.tx:hover{background:var(--soft)}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-sub{font-size:.85rem;color:var(--muted)}
.tx-amt{text-align:right;font-weight:800;white-space:nowrap;display:flex;flex-direction:column}
.tx-amt.pos{color:var(--pos)}
.tx-card{font-size:.8rem;font-weight:500;color:var(--muted)}
.date-head{font-size:.9rem;font-weight:700;color:var(--muted);padding:1rem .6rem .35rem;border-bottom:1px solid var(--line);margin-bottom:.25rem}

/* donut & legend */
.donut-wrap{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.donut{width:11rem;height:11rem;flex-shrink:0;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.8rem}
.donut .center small{font-size:.8rem;color:var(--muted)}
.donut .center b{font-size:1.15rem;line-height:1.2;word-break:break-all}
.legend{list-style:none;flex:1;min-width:14rem;display:flex;flex-direction:column;gap:.35rem}
.legend li{display:flex;align-items:center;gap:.65rem;padding:.35rem 0}
.legend .badge{width:2.2rem;height:2.2rem;border-radius:.7rem}
.legend .nm{flex:1;font-weight:600}
.legend .am{font-weight:700;text-align:right}
.legend .pc{min-width:3.2rem;text-align:right;color:var(--muted);font-weight:600}

/* goals */
.ring{position:relative;flex-shrink:0}
.ring>svg{transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.goal-mini{display:flex;align-items:center;gap:.9rem;padding:.6rem 0}
.goal-mini .g-txt{flex:1;min-width:0}
.goal-mini .g-name{font-weight:700}
.progress{height:.65rem;background:var(--soft-2);border-radius:999px;overflow:hidden;margin-top:.4rem}
.progress>span{display:block;height:100%;background:var(--brand);border-radius:999px}
[data-contrast="high"] .progress{border:1px solid var(--ink)}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1.25rem}
.goal-card .g-top{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.goal-card h3{font-size:1.15rem}
.goal-card dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .75rem;margin:.75rem 0 1rem}
.goal-card dt{color:var(--muted)}
.goal-card dd{font-weight:700;text-align:right}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:var(--pos-bg);color:var(--pos)}

/* accounts */
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));gap:1.25rem}
.card-vis{height:9.5rem;border-radius:1.1rem;padding:1.1rem;color:#fff;position:relative;overflow:hidden}
.card-vis::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 7px);mask:radial-gradient(ellipse at 70% 60%,#000 20%,transparent 75%)}
.card-vis.dark{background:radial-gradient(circle at 70% 70%,#1d8f9b 0%,#0e2b3a 55%,#08161e 100%)}
.card-vis.teal{background:linear-gradient(135deg,#1d9b91 0%,#1e7fa1 60%,#2a5c8f 100%)}
.card-vis.violet{background:linear-gradient(135deg,#7a67e6 0%,#4b3cc4 100%)}
.card-vis.black{background:linear-gradient(135deg,#2b2b2b,#050505)}
.card-vis.sunset{background:linear-gradient(135deg,#d9663a 0%,#b23a62 100%)}
.card-vis>*{position:absolute}
.card-vis .c-amt{top:1rem;left:1.1rem;font-size:1.35rem;font-weight:800}
.card-vis .c-name{top:3.1rem;left:1.1rem;font-size:.9rem;opacity:.95;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-vis .c-type{bottom:2.4rem;left:1.1rem;font-size:.8rem;opacity:.9}
.card-vis .c-num{bottom:1rem;left:1.1rem;font-size:.95rem;letter-spacing:.08em}
.card-vis .c-brand{bottom:1rem;right:1.1rem;font-weight:900;font-style:italic;font-size:1.05rem}
.card-vis .c-nfc{top:1.1rem;right:1.1rem;opacity:.85}
.mc{display:flex}.mc i{width:1.15rem;height:1.15rem;border-radius:50%;display:block}
.mc i:first-child{background:#eb001b}.mc i:last-child{background:#f79e1b;margin-left:-.45rem;opacity:.9}
.acct-info{display:grid;grid-template-columns:auto 1fr;gap:.3rem .75rem;margin:1rem 0}
.acct-info dt{color:var(--muted)}
.acct-info dd{text-align:right;font-weight:700}
.acct-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.acct-actions .btn{padding:.5rem .4rem;font-size:.9rem;flex-direction:column;gap:.2rem;min-height:3.6rem;border-radius:1rem}
.swatches{display:flex;gap:.6rem;flex-wrap:wrap}
.swatch{position:relative}
.swatch input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.swatch span{display:block;width:2.75rem;height:2.75rem;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line-strong)}
.swatch input:checked+span{box-shadow:0 0 0 3px var(--accent)}
.swatch input:focus-visible+span{outline:3px solid var(--focus);outline-offset:3px}

/* empty states */
.empty-state{text-align:center;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.empty-state .es-ico{width:4rem;height:4rem;border-radius:1.25rem;display:grid;place-items:center;background:var(--info-bg);color:var(--accent);margin-bottom:.25rem}
.empty-state h3{font-size:1.15rem}
.empty-state p{color:var(--muted);max-width:28rem}
.empty-state.sm{padding:1.25rem .5rem}

/* transfers */
.stepper{list-style:none;display:flex;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap}
.stepper li{flex:1;min-width:6.5rem;display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border-radius:1rem;background:var(--panel);border:2px solid var(--line);font-weight:600;font-size:.92rem;color:var(--muted)}
.stepper .n{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:var(--soft-2);font-weight:800;flex-shrink:0;color:var(--ink)}
.stepper li[aria-current="step"]{border-color:var(--accent);color:var(--ink)}
.stepper li[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.stepper li.done .n{background:var(--pos);color:#fff}
.stepper li.done{color:var(--ink)}
.recip-list{list-style:none;display:flex;flex-direction:column;gap:.4rem;margin:1rem 0;max-height:28rem;overflow:auto;padding:.25rem}
.recip{display:flex;align-items:center;gap:.85rem;width:100%;padding:.75rem;border-radius:1rem;border:2px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;min-height:4rem}
.recip:hover{border-color:var(--accent);background:var(--soft)}
.recip .r-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.recip .r-name{font-weight:700}
.recip .r-sub{font-size:.85rem;color:var(--muted)}
.recip .r-fee{font-size:.85rem;font-weight:700;white-space:nowrap}
.recip-row{display:flex;gap:.4rem;align-items:stretch}
.recip-row .recip{flex:1}
.list-head{font-size:.9rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:.75rem 0 .25rem .25rem}
.sel-recip{display:flex;align-items:center;gap:.85rem;padding:.9rem;border-radius:1rem;background:var(--soft);margin-bottom:1.25rem;flex-wrap:wrap}
.sel-recip .r-txt{flex:1;min-width:10rem}
.pay-from{display:flex;flex-direction:column;gap:.5rem}
.radio-card{display:flex;align-items:center;gap:.85rem;padding:.8rem 1rem;border:2px solid var(--line);border-radius:1rem;cursor:pointer;background:var(--panel)}
.radio-card:hover{border-color:var(--accent)}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--info-bg)}
.radio-card input{width:1.35rem;height:1.35rem;accent-color:var(--accent);flex-shrink:0}
.radio-card .rc-txt{flex:1;display:flex;flex-direction:column}
.radio-card .rc-bal{font-weight:800}
.fee-box{border-radius:1rem;background:var(--soft);padding:1rem 1.1rem;margin:.25rem 0 1rem}
.fee-row{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0}
.fee-row.total{border-top:2px solid var(--line);margin-top:.35rem;padding-top:.6rem;font-size:1.1rem;font-weight:800}
.fee-row .lbl{display:flex;align-items:center;gap:.2rem}
.review-list{display:grid;grid-template-columns:minmax(8rem,auto) 1fr;border:2px solid var(--line);border-radius:1rem;overflow:hidden;margin:1rem 0}
.review-list dt,.review-list dd{padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.review-list dt{color:var(--muted);font-weight:600;background:var(--soft)}
.review-list dd{font-weight:700;text-align:right;word-break:break-word}
.review-list .big{font-size:1.25rem}
.review-list dt:last-of-type,.review-list dd:last-of-type{border-bottom:0}
.result{text-align:center;padding:2rem 1rem}
.result .r-ico{width:5rem;height:5rem;border-radius:50%;display:grid;place-items:center;margin:0 auto 1rem}
.result.ok .r-ico{background:var(--pos-bg);color:var(--pos)}
.result.fail .r-ico{background:var(--neg-bg);color:var(--neg)}
.result h2{font-size:1.6rem;margin-bottom:.4rem}
.result .actions{justify-content:center}
.dup-check{display:flex;gap:.65rem;align-items:center;margin-top:.75rem;font-weight:700;cursor:pointer}
.dup-check input{width:1.4rem;height:1.4rem;accent-color:var(--accent)}

/* receipt */
.receipt{border:2px dashed var(--line-strong);border-radius:1rem;padding:1.25rem}
.receipt .r-head{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.15rem;margin-bottom:.25rem}
.receipt .r-status{display:inline-flex;align-items:center;gap:.3rem;color:var(--pos);font-weight:700;margin-bottom:.75rem}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem}
.receipt dt{color:var(--muted)}
.receipt dd{text-align:right;font-weight:700;word-break:break-word}
.receipt .r-total{border-top:2px solid var(--line);padding-top:.5rem;font-size:1.1rem}
.receipt .r-foot{margin-top:1rem;font-size:.8rem;color:var(--muted)}

/* investments */
.inv-row{display:grid;grid-template-columns:auto minmax(0,1fr) 6.5rem auto;align-items:center;gap:.9rem;padding:.8rem .25rem;border-bottom:1px solid var(--line)}
.inv-row:last-child{border-bottom:0}
.inv-row .nm{font-weight:700}
.inv-row .tk{font-size:.85rem;color:var(--muted)}
.inv-row .pr{text-align:right;font-weight:800}
.chg{display:inline-flex;align-items:center;gap:.2rem;font-size:.88rem;font-weight:700;justify-content:flex-end}
.chg.up{color:var(--pos)}.chg.down{color:var(--neg)}
.inv-row svg.spark{width:6.5rem;height:2.4rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem}
.stat{background:var(--soft);border-radius:1rem;padding:1rem}
.stat .s-lbl{font-weight:600;color:var(--muted);display:flex;align-items:center;gap:.2rem}
.stat .s-val{font-size:1.45rem;font-weight:800;line-height:1.25}
.stat .s-cmp{font-size:.85rem;color:var(--muted)}

/* reports */
.controls{display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end}
.controls .field{margin:0}
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{width:100%;min-width:30rem;height:auto}
.chart-legend{display:flex;gap:1.25rem;flex-wrap:wrap;list-style:none;margin-bottom:.75rem;font-weight:600}
.chart-legend li{display:flex;align-items:center;gap:.45rem}
.chart-legend .sw{width:1.15rem;height:1.15rem;border-radius:.3rem;border:1px solid var(--ink)}
.data-table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.95rem}
.data-table caption{text-align:left;font-weight:700;margin-bottom:.5rem}
.data-table th,.data-table td{padding:.6rem .7rem;border-bottom:1px solid var(--line);text-align:right}
.data-table th:first-child,.data-table td:first-child{text-align:left}
.data-table thead th{background:var(--soft);font-weight:700}
.cat-bars{list-style:none;display:flex;flex-direction:column;gap:.9rem}
.cat-bars .cb-top{display:flex;align-items:center;gap:.65rem;margin-bottom:.35rem}
.cat-bars .badge{width:2.2rem;height:2.2rem;border-radius:.7rem}
.cat-bars .nm{flex:1;font-weight:700}
.cat-bars .am{font-weight:800}
.cat-bars .pc{color:var(--muted);font-weight:600;min-width:3rem;text-align:right}
.cat-bars .bar{height:.8rem;border-radius:999px;background:var(--soft-2);overflow:hidden}
.cat-bars .bar span{display:block;height:100%;border-radius:999px}
.insights{list-style:none;display:flex;flex-direction:column;gap:.6rem}
.insights li{display:flex;gap:.65rem;align-items:flex-start;padding:.75rem .9rem;border-radius:.9rem;background:var(--soft)}
.insights .ico{color:var(--accent);margin-top:.15rem}
details.gloss{border:2px solid var(--line);border-radius:1rem;padding:.25rem 1rem;background:var(--panel)}
details.gloss summary{cursor:pointer;font-weight:700;min-height:3rem;display:flex;align-items:center;gap:.5rem}
details.gloss dl{padding:.5rem 0 1rem}
details.gloss dt{font-weight:800;margin-top:.75rem}
details.gloss dd{color:var(--muted)}

/* settings */
.set-layout{display:grid;grid-template-columns:14rem minmax(0,1fr);gap:1.5rem;align-items:start}
.set-nav{position:sticky;top:6rem;display:flex;flex-direction:column;gap:.25rem}
.set-nav a{display:flex;align-items:center;gap:.6rem;min-height:2.9rem;padding:.4rem .8rem;border-radius:.8rem;color:var(--ink);text-decoration:none;font-weight:600}
.set-nav a:hover{background:var(--panel)}
.set-sec{scroll-margin-top:6rem}
.set-sec h2{font-size:1.2rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
.set-sec .sec-desc{color:var(--muted);margin-bottom:1rem}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.65rem}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;min-height:3.4rem;padding:.75rem 1rem;border:2px solid var(--line);border-radius:1rem;background:var(--panel);font-weight:700;height:100%}
.opt span small{font-weight:500;color:var(--muted)}
.opt input:checked+span{border-color:var(--accent);background:var(--info-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.opt:hover span{border-color:var(--accent)}
.act-list{list-style:none;max-height:22rem;overflow:auto}
.act-list li{display:flex;gap:.75rem;padding:.7rem .25rem;border-bottom:1px solid var(--line);align-items:flex-start}
.act-list .a-txt{flex:1}
.act-list .a-sub{font-size:.85rem;color:var(--muted)}
.pw-rules{list-style:none;font-size:.9rem;display:flex;flex-direction:column;gap:.2rem;margin-top:.25rem}
.pw-rules li{display:flex;gap:.4rem;align-items:center;color:var(--muted)}
.pw-rules li.ok{color:var(--pos);font-weight:600}

/* ---------- Dialogs ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,18,21,.6);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:100;animation:fade .15s ease}
.dialog{background:var(--panel);color:var(--ink);border-radius:1.5rem;width:100%;max-width:32rem;max-height:92vh;overflow:auto;padding:1.5rem;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .18s ease}
.dialog.wide{max-width:42rem}
.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.dialog-head h2{font-size:1.3rem;outline:none;padding-top:.5rem}
.dialog-head .icon-btn{box-shadow:none;background:var(--soft)}
.lead{color:var(--muted);margin-bottom:1rem}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.sheet-list{list-style:none;display:flex;flex-direction:column;gap:.4rem}
.sheet-list a,.sheet-list button{display:flex;align-items:center;gap:.9rem;width:100%;min-height:3.5rem;padding:.6rem 1rem;border-radius:1rem;border:2px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-weight:700;cursor:pointer;text-align:left}
.sheet-list a:hover,.sheet-list button:hover{border-color:var(--accent)}
.sheet-list small{display:block;font-weight:500;color:var(--muted)}
.notif-list{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.notif-list li{display:flex;gap:.75rem;padding:.8rem;border-radius:1rem;background:var(--soft);align-items:flex-start}
.notif-list li.unread{background:var(--info-bg);border-left:4px solid var(--accent)}
.notif-list .n-txt{flex:1}
.notif-list .n-time{font-size:.8rem;color:var(--muted)}
.mp-year{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;font-size:1.2rem}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.mp-grid button{min-height:3.25rem;border-radius:.9rem;border:2px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer;position:relative}
.mp-grid button:hover{border-color:var(--accent)}
.mp-grid button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.mp-grid button.now{border-color:var(--accent)}
.mp-grid button.has::after{content:"";position:absolute;bottom:.35rem;left:50%;width:.4rem;height:.4rem;margin-left:-.2rem;border-radius:50%;background:var(--brand)}
.tour-dots{display:flex;gap:.4rem;justify-content:center;margin:1rem 0 .25rem}
.tour-dots span{width:.6rem;height:.6rem;border-radius:50%;background:var(--line-strong)}
.tour-dots span.on{background:var(--accent);width:1.6rem;border-radius:999px}
.tour-ico{width:4.5rem;height:4.5rem;border-radius:1.4rem;display:grid;place-items:center;background:var(--info-bg);color:var(--accent);margin-bottom:1rem}
.tour-body p{font-size:1.05rem;margin-bottom:.75rem}
.tour-body ul{padding-left:1.25rem;margin:.25rem 0 .75rem}
.tour-body li{margin:.3rem 0}

/* toasts */
.toasts{position:fixed;bottom:1.25rem;right:1.25rem;z-index:200;display:flex;flex-direction:column;gap:.5rem;width:min(30rem,calc(100vw - 2rem));pointer-events:none}
.toast{display:flex;gap:.65rem;align-items:flex-start;background:var(--navy);color:var(--navy-ink);padding:.9rem 1.1rem;border-radius:1rem;box-shadow:0 12px 30px rgba(0,0,0,.3);font-weight:600;animation:pop .2s ease;pointer-events:auto}
.toast.error{background:var(--neg);color:#fff}
.toast.success{background:var(--pos);color:#fff}
[data-theme="dark"] .toast.error,[data-theme="dark"] .toast.success{color:#000}
.toast.out{opacity:0;transition:opacity .3s}

/* ---------- Auth screens ---------- */
.auth-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px),linear-gradient(135deg,#0d6f86 0%,#127f88 45%,#1d8f8f 100%)}
[data-contrast="high"] .auth-page{background:var(--bg)}
.auth-card{background:var(--panel);border-radius:1.75rem;padding:2rem;width:100%;max-width:30rem;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.auth-card .brand{padding:0 0 1rem;justify-content:center}
.auth-card h1{font-size:1.6rem;text-align:center;margin-bottom:.35rem}
.auth-card .sub{text-align:center;color:var(--muted);margin-bottom:1.5rem}
.a11y-bar{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:1rem;width:100%;max-width:30rem}
.a11y-bar .pill{display:inline-flex;align-items:center;gap:.35rem;min-height:2.75rem;padding:.3rem .9rem;border-radius:999px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.25);color:#fff;font-weight:700;cursor:pointer}
.a11y-bar .pill[aria-pressed="true"]{background:#fff;color:#0f2f33}
.a11y-bar select.pill{appearance:auto}
.a11y-bar select.pill option{color:#000}
[data-contrast="high"] .a11y-bar .pill{border-color:var(--ink);color:var(--ink);background:var(--panel)}
.or{display:flex;align-items:center;gap:.75rem;color:var(--muted);margin:1rem 0;font-size:.9rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-note{margin-top:1.25rem;font-size:.85rem;color:var(--muted);display:flex;gap:.5rem;align-items:flex-start}

/* ---------- Responsive ---------- */
@media (max-width:1240px){
  .w7,.w5,.w8,.w4{grid-column:1/-1}
}
@media (max-width:1100px){
  .shell{grid-template-columns:6.5rem minmax(0,1fr)}
  .sidebar{padding:1rem .5rem;align-items:stretch}
  .brand span{display:none}
  .brand{justify-content:center;padding:.25rem 0 .75rem}
  .nav a,.nav-btn{flex-direction:column;gap:.25rem;font-size:.75rem;text-align:center;padding:.55rem .25rem;justify-content:center;line-height:1.15}
  .topbar,.content,.foot-note{padding-left:1.25rem;padding-right:1.25rem}
  .set-layout{grid-template-columns:1fr}
  .set-nav{position:static;flex-direction:row;flex-wrap:wrap}
  .set-nav a{background:var(--panel);border:2px solid var(--line)}
}
@media (max-width:860px){
  .w6{grid-column:1/-1}
}
@media (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .m-brand{display:block}
  .topbar{padding:.65rem 1rem;gap:.5rem}
  .topbar h1{font-size:1.25rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hide-sm{display:none!important}
  .content{padding:.25rem 1rem 1rem}
  .foot-note{padding:0 1rem 7rem}
  .panel{padding:1.1rem;border-radius:1.1rem}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--line);padding:.35rem .25rem calc(.35rem + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:3.6rem;border-radius:.9rem;text-decoration:none;color:var(--ink);font-size:.75rem;font-weight:700;background:none;border:0;cursor:pointer;text-align:center;line-height:1.1;padding:.2rem}
  .bn-item[aria-current="page"]{color:var(--accent)}
  .bn-item[aria-current="page"] .ico{background:var(--info-bg);border-radius:999px;padding:.15rem .9rem;box-sizing:content-box}
  .qa-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2{grid-template-columns:1fr}
  .inv-row{grid-template-columns:auto minmax(0,1fr) auto}
  .inv-row svg.spark{display:none}
  .modal-backdrop{align-items:flex-end;padding:0}
  .dialog{border-radius:1.5rem 1.5rem 0 0;max-height:94vh;padding:1.25rem 1.1rem calc(1.25rem + env(safe-area-inset-bottom))}
  .actions{flex-direction:column-reverse}
  .actions .btn{width:100%}
  .review-list{grid-template-columns:1fr}
  .review-list dt{border-bottom:0;padding-bottom:.2rem}
  .review-list dd{text-align:left;padding-top:.1rem}
  .toasts{bottom:6rem;right:auto;left:50%;transform:translateX(-50%)}
  .donut{margin:0 auto}
  .stepper li .lbl{display:none}
  .stepper li[aria-current="step"]{flex:2.2}
  .stepper li[aria-current="step"] .lbl{display:inline}
  .stepper li{justify-content:center;min-width:0}
  .auth-card{padding:1.5rem 1.25rem}
  .cur-select{padding:0 .5rem;min-height:2.75rem}
  .icon-btn,.avatar{width:2.75rem;height:2.75rem}
}
@media (max-width:380px){
  .top-actions .cur-select{display:none}
}

@media print{
  body *{visibility:hidden}
  .print-target,.print-target *{visibility:visible}
  .print-target{position:absolute;left:0;top:0;width:100%;border:0}
  .no-print{display:none!important}
}
[data-contrast="high"] .toast{border:2px solid var(--ink);animation:none}
[data-theme="dark"][data-contrast="high"] .toast{background:#000;color:#fff;border-color:#fff}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const STORE="zelora-app-v2", PREV_STORE="finora-app-v2", OLD_STORE="finora-dashboard-v1";
const LIMIT_TX=5000, LIMIT_DAY=10000, PERSON_FEE=0.25;   // USD base (prototype rules)
const SYM={USD:"$",EUR:"€",PHP:"₱"};
const CUR_LIST=["PHP","USD","EUR"];

PAYEES.forEach(p=>{p.id="p:"+p.name;if(p.person)p.account=PEOPLE_ACCT[p.name];});

const DEFAULTS={lang:"en",font:"m",theme:"light",contrast:false,reduceMotion:false,showTips:true,
  currency:"PHP",rates:{USD:1,EUR:0.86,PHP:59},hideBalances:false,autoLock:5,askAuthTransfer:true,biometricId:null,
  notif:{transfers:true,deposits:true,security:true,lowBalance:true,lowBalanceAmt:50,goals:true},
  dash:{summary:true,breakdown:true,recent:true,goals:true,invest:true},livePrices:true,tourDone:false};
function freshState(){return {v:2,profile:null,settings:clone(DEFAULTS),cards:[],transactions:[],goals:[],recipients:[],notifications:[],activity:[],security:{failed:0,lockUntil:0}};}
let S=freshState();
const session={unlocked:false,since:null,last:Date.now(),hide:false,storageOk:true,savedAt:null,page:"home",bioAvail:false};

/* ---------- storage ---------- */
function deepMerge(base,over){for(const k in over){if(over[k]&&typeof over[k]==="object"&&!Array.isArray(over[k])&&base[k]&&typeof base[k]==="object")deepMerge(base[k],over[k]);else base[k]=over[k];}return base;}
function normalize(){
  S.transactions.forEach(x=>{x.date=new Date(x.date);x.id=x.id||uid();x.ref=x.ref||makeRef(x.date);x.fee=x.fee||0;});
  S.cards.forEach(c=>{c.id=c.id||uid();c.name=c.name||"My card";c.type=c.type||"Debit";c.style=c.style||"dark";});
}
function load(){
  try{
    const raw=localStorage.getItem(STORE)||localStorage.getItem(PREV_STORE);
    if(raw){const d=JSON.parse(raw);S=Object.assign(freshState(),d);S.settings=deepMerge(clone(DEFAULTS),d.settings||{});}
    else{ // migrate data saved by the previous dashboard version
      const old=localStorage.getItem(OLD_STORE);
      if(old){const d=JSON.parse(old);S.cards=d.cards||[];S.transactions=d.transactions||[];if(d.cur)S.settings.currency=d.cur;session.migrated=true;}
    }
  }catch(e){session.storageOk=false;}
  normalize();
}
let saveTimer;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,200);}
function saveNow(){
  try{localStorage.setItem(STORE,JSON.stringify(S));session.storageOk=true;session.savedAt=new Date();}

function money(u,{d=2,sign=false}={}){const v=conv(u);return (v<0?"-":(sign&&v>0?"+":""))+SYM[curCode()]+nf(Math.abs(v),d);}
function moneyShort(u){const v=Math.abs(conv(u)),s=SYM[curCode()];return v>=1e6?s+nf(v/1e6,1)+"M":v>=1e4?s+nf(v/1e3,0)+"k":v>=1e3?s+nf(v/1e3,1)+"k":s+nf(v,0);}

const fTime=d=>new Date(d).toLocaleTimeString(locale(),{hour:"numeric",minute:"2-digit"});

function parseAmount(str){
  const s=String(str||"").replace(/[,\s]/g,"").replace(/^[₱$€]/,"");
  if(!s)return {err:"err.amountEmpty"};
  if(!/^\d+(\.\d{1,2})?$/.test(s))return {err:"err.amountInvalid"};

/* ---------- calculations ---------- */
const totalBal=()=>S.cards.reduce((a,c)=>a+c.amount,0);
const cardByNum=n=>S.cards.find(c=>c.num===n);
function periodTx(y,m){return S.transactions.filter(x=>x.date.getFullYear()===y&&(m==null||x.date.getMonth()===m));}
function sums(list){let inc=0,out=0,sav=0,fees=0;list.forEach(x=>{if(x.type==="deposit")inc+=x.amount;else if(x.type==="goal")sav+=x.amount;else{out+=x.amount+(x.fee||0);fees+=x.fee||0;}});return {inc,out,sav,fees,net:inc-out-sav};}
function groupBy(list,mode){
  const g={};
  list.forEach(x=>{
    if(mode==="spending"&&x.type==="expense"){g[x.cat]=(g[x.cat]||0)+x.amount;if(x.fee)g.Fees=(g.Fees||0)+x.fee;}
    if(mode==="deposits"&&x.type==="deposit")g[x.cat]=(g[x.cat]||0)+x.amount;
  });
  const total=Object.values(g).reduce((a,b)=>a+b,0);
  return {total,items:Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,v,p:total?v/total*100:0,c:(mode==="spending"?CAT:SOURCES)[k]?.c||"#64748b"}))};
}
function usedToday(){const d=new Date();return S.transactions.filter(x=>x.type==="expense"&&sameDay(x.date,d)).reduce((a,x)=>a+x.amount,0);}
const payee=name=>allRecipients().find(p=>p.name===name);
function allRecipients(){return [...S.recipients,...PAYEES];}
const recipById=id=>allRecipients().find(p=>p.id===id);
const feeFor=p=>p&&p.person?PERSON_FEE:0;
function txIcon(x){
  if(x.type==="deposit")return SRC_ICON[x.cat]||"down";
  if(x.type==="goal")return "target";

function colorFor(x){
  if(x.type==="deposit")return (SOURCES[x.cat]||SOURCES.Other).c;
  if(x.type==="goal")return "#1ba9a0";

}

/* ---------- toasts ---------- */
function toast(msg,kind="info"){
  const box=$("#toasts");if(!box)return;
  const el=document.createElement("div");el.className="toast "+kind;
  if(kind==="error")el.setAttribute("role","alert");
  el.innerHTML=ic(kind==="success"?"checkCircle":kind==="error"?"xCircle":"info",20)+"<span>"+esc(msg)+"</span>";

/* ---------- dialogs (focus-trapped, Esc to close, inert background) ---------- */
const dialogs=[];
function refreshInert(){const a=$("#app");if(a)a.inert=dialogs.length>0;dialogs.forEach((d,i)=>d.el.inert=i<dialogs.length-1);}
function openDialog({title,html,wide=false,onClose,dismissible=true,cls=""}){
  const prev=document.activeElement,id="d"+uid();
  const bd=document.createElement("div");bd.className="modal-backdrop";
  bd.innerHTML=`<div class="dialog ${wide?"wide":""} ${cls}" role="dialog" aria-modal="true" aria-labelledby="${id}"><div class="dialog-head"><h2 id="${id}" tabindex="-1">${title}</h2>${dismissible?`<button type="button" class="icon-btn no-print" data-close aria-label="${t("close")}">${ic("x",22)}</button>`:""}</div><div class="dialog-body">${html}</div></div>`;
  document.body.append(bd);
  const dlg={el:bd,box:bd.firstElementChild,dismissible,closed:false,close(res){
    if(dlg.closed)return;dlg.closed=true;bd.remove();dialogs.splice(dialogs.indexOf(dlg),1);refreshInert();
    onClose&&onClose(res);if(prev&&prev.isConnected&&!dialogs.length)prev.focus({preventScroll:true});}};
  dialogs.push(dlg);refreshInert();
  bd.addEventListener("mousedown",e=>{if(e.target===bd&&dismissible)dlg.close();});
  bd.addEventListener("click",e=>{if(e.target.closest("[data-close]"))dlg.close();});
  setTimeout(()=>{const f=bd.querySelector("[autofocus]")||bd.querySelector(".dialog-body input:not([type=hidden]),.dialog-body select,.dialog-body textarea")||bd.querySelector("h2");f&&f.focus();},40);
  return dlg;
}
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
document.addEventListener("keydown",e=>{
  const top=dialogs[dialogs.length-1];
  if(e.key==="Escape"){
    const open=$(".bubble:not([hidden])");if(open){closeTips();return;}
    if(top&&top.dismissible){e.preventDefault();top.close();}
  }
  if(e.key==="Tab"&&top){
    const f=$$(FOCUSABLE,top.box).filter(x=>x.offsetParent!==null);if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    else if(!top.box.contains(document.activeElement)){e.preventDefault();first.focus();}
  }
});
function confirmDialog({title,message,ok,danger=false}){
  return new Promise(res=>{let done=false;
    const d=openDialog({title,html:`<p class="lead" style="color:var(--ink)">${message}</p><div class="actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button type="button" class="btn ${danger?"danger":"primary"}" id="cfOk">${ok||t("confirm")}</button></div>`,onClose:()=>{if(!done)res(false);}});
    $("#cfOk",d.el).onclick=()=>{done=true;d.close();res(true);};
  });
}

/* ---------- password helpers ---------- */
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){try{
    const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},key,256);
    return "pbkdf2$"+b64(bits);}catch(e){}}
  let h=2166136261;const s=salt+"|"+pw;for(let r=0;r<4000;r++)for(let i=0;i<s.length;i++){h^=s.charCodeAt(i)+r;h=Math.imul(h,16777619);}
  return "fnv$"+(h>>>0).toString(16);
}
async function checkPw(pw){return (await hashPw(pw,S.profile.salt))===S.profile.hash;}
function pwRules(pw){return {len:pw.length>=8,letter:/[A-Za-z]/.test(pw),num:/\d/.test(pw)};}
function pwField(id,label,ac="current-password",help=""){
  return `<div class="field"><label for="${id}">${label}</label><div class="input-group" style="padding-left:0"><input id="${id}" type="password" autocomplete="${ac}" ${help?`aria-describedby="${id}-h"`:""} style="padding-left:.9rem" /><button type="button" class="suffix-btn" data-pw="${id}" aria-pressed="false" aria-label="${t("pw.show")}">${ic("eye",20)}</button></div>${help?`<p class="help" id="${id}-h">${help}</p>`:""}</div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-pw]");if(!b)return;
  const inp=document.getElementById(b.dataset.pw);const show=inp.type==="password";
  inp.type=show?"text":"password";b.setAttribute("aria-pressed",String(show));
  b.setAttribute("aria-label",show?t("pw.hide"):t("pw.show"));b.innerHTML=ic(show?"eyeOff":"eye",20);
});
function setErr(id,msg){const el=document.getElementById(id);if(!el)return;if(msg){el.innerHTML=ic("alert",16)+"<span>"+msg+"</span>";el.hidden=false;}else{el.hidden=true;el.innerHTML="";}}
function markInvalid(input,bad,errId){if(!input)return;input.setAttribute("aria-invalid",bad?"true":"false");if(errId){const ids=new Set((input.getAttribute("aria-describedby")||"").split(" ").filter(Boolean));bad?ids.add(errId):ids.delete(errId);ids.size?input.setAttribute("aria-describedby",[...ids].join(" ")):input.removeAttribute("aria-describedby");}const g=input.closest(".input-group");if(g)g.dataset.invalid=bad?"true":"false";}

/* ---------- biometrics (WebAuthn platform authenticator) ---------- */
async function bioAvailable(){try{return !!(window.PublicKeyCredential&&window.isSecureContext&&location.protocol!=="file:"&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
async function bioRegister(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"ZELORA"},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:S.profile.email||S.profile.name,displayName:S.profile.name},
    pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000,attestation:"none"}});
  return b64(cred.rawId);
}
async function bioVerify(){
  try{const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:unb64(S.settings.biometricId)}],userVerification:"required",timeout:60000}});return !!a;}
  catch(e){return false;}
}

/* ---------- re-authentication before sensitive actions ---------- */
function requireAuth(reason){
  return new Promise(res=>{
    let done=false,tries=0;const bio=S.settings.biometricId&&session.bioAvail;
    const d=openDialog({title:t("auth.title"),html:`<p class="lead">${reason}</p>
      <form id="authF" novalidate>${pwField("authPw",t("auth.password"))}
      <p class="err" id="authErr" role="alert" hidden></p>
      <div class="actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn primary" type="submit">${ic("lock",18)} ${t("auth.confirm")}</button></div>
      ${bio?`<div class="or">${t("or")}</div><button type="button" class="btn secondary block" id="authBio">${ic("fingerprint",20)} ${t("auth.useBio")}</button>`:""}</form>`,
      onClose:()=>{if(!done)res(false);}});
    const finish=ok=>{done=true;d.close();res(ok);};
    $("#authF",d.el).onsubmit=async e=>{
      e.preventDefault();const inp=$("#authPw",d.el);const pw=inp.value;
      if(!pw){setErr("authErr",t("auth.empty"));markInvalid(inp,true,"authErr");inp.focus();return;}
      if(await checkPw(pw)){logAct("act.reauth");finish(true);}
      else{tries++;logAct("act.authFail");inp.value="";markInvalid(inp,true,"authErr");
        if(tries>=3){notify("security",t("n.authFailT"),t("n.authFailB"));toast(t("auth.tooMany"),"error");finish(false);}
        else{setErr("authErr",t("auth.wrong",{n:3-tries}));inp.focus();}}
    };
    const bb=$("#authBio",d.el);if(bb)bb.onclick=async()=>{if(await bioVerify()){logAct("act.bioOk");finish(true);}else setErr("authErr",t("auth.bioFail"));};
  });
}

function ring(pct,color,size=56,stroke=6,label=""){
  const r=(size-stroke)/2,C=2*Math.PI*r,off=C*(1-Math.min(pct,100)/100);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft-2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><span class="rc">${label}</span></div>`;
}
function sparkSvg(data,color,w=110,h=44){
  if(!data.length)data=[0,0];const max=Math.max(...data),min=Math.min(...data),rg=(max-min)||1;
  const pts=data.map((v,i)=>[i*(w/Math.max(data.length-1,1)),h-5-((v-min)/rg)*(h-12)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true" focusable="false"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---------- deposit (with review + explicit confirmation) ---------- */
function openDeposit(cardId){
  if(!S.cards.length){toast(t("dep.needCard"),"error");return openCardDialog();}
  const pre=Math.max(0,S.cards.findIndex(c=>c.id===cardId));
  const d=openDialog({title:t("dep.title"),html:`<div id="depBody"></div>`});
  const st={card:pre,amount:"",source:"Salary",date:new Date().toISOString().slice(0,10),note:"",step:1};
  const draw=()=>{
    const b=$("#depBody",d.el);
    if(st.step===1){
      b.innerHTML=`<div class="alert">${ic("info",20)}<p>${t("dep.lead")}</p></div><form id="depF" novalidate>
        <fieldset class="field"><legend>${t("dep.toCard")}</legend><div class="pay-from">${S.cards.map((c,i)=>`<label class="radio-card"><input type="radio" name="dCard" value="${i}" ${i===st.card?"checked":""}><span class="badge" style="--c:#1ba9a0">${ic("card",18)}</span><span class="rc-txt"><strong>${esc(c.name)}</strong><span class="help">•••• ${esc(c.num)}</span></span><span class="rc-bal">${sens(c.amount)}</span></label>`).join("")}</div></fieldset>
        <div class="field"><label for="dAmt">${t("amount")} (${curCode()})</label><div class="input-group"><span class="prefix">${SYM[curCode()]}</span><input id="dAmt" inputmode="decimal" placeholder="0.00" value="${esc(st.amount)}" autocomplete="off"></div><p class="err" id="dAmtErr" hidden></p></div>
        <div class="grid-2"><div class="field"><label for="dSrc">${t("dep.source")} ${tip("deposit")}</label><select class="input" id="dSrc">${Object.keys(SOURCES).map(k=>`<option value="${k}" ${k===st.source?"selected":""}>${catLabel(k)}</option>`).join("")}</select></div>
        <div class="field"><label for="dDate">${t("date")}</label><input class="input" type="date" id="dDate" value="${st.date}" aria-describedby="dDateH"><p class="help" id="dDateH">${t("dep.dateHelp")}</p></div></div>
        <div class="field"><label for="dNote">${t("noteOpt")}</label><input class="input" id="dNote" maxlength="40" value="${esc(st.note)}" placeholder="${t("dep.notePh")}"></div>
        <div class="actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn primary" type="submit">${t("review")} ${ic("arrowR",18)}</button></div></form>`;
      $("#depF",d.el).onsubmit=e=>{e.preventDefault();
        st.card=+$("#depF",d.el).dCard.value;st.amount=$("#dAmt",d.el).value;st.source=$("#dSrc",d.el).value;st.date=$("#dDate",d.el).value;st.note=$("#dNote",d.el).value.trim();
        const a=parseAmount(st.amount),inp=$("#dAmt",d.el);
        if(a.err){setErr("dAmtErr",t(a.err));markInvalid(inp,true,"dAmtErr");inp.focus();return;}
        if(a.usd>100000){setErr("dAmtErr",t("err.depMax",{max:money(100000)}));markInvalid(inp,true,"dAmtErr");inp.focus();return;}
        if(!st.date){toast(t("err.date"),"error");return;}
        st.usd=a.usd;st.step=2;draw();$("h2",d.el).focus();
      };
    }else{
      const c=S.cards[st.card];
      b.innerHTML=`<p class="lead">${t("dep.reviewLead")}</p><dl class="review-list"><dt>${t("dep.toCard")}</dt><dd>${esc(c.name)} •••• ${esc(c.num)}</dd><dt>${t("amount")}</dt><dd class="big">${money(st.usd)}</dd><dt>${t("dep.source")}</dt><dd>${catLabel(st.source)}</dd><dt>${t("date")}</dt><dd>${fDate(st.date+"T12:00")}</dd>${st.note?`<dt>${t("note")}</dt><dd>${esc(st.note)}</dd>`:""}<dt>${t("balAfter")}</dt><dd>${money(c.amount+st.usd)}</dd></dl>
        <p class="help" style="margin-bottom:.5rem">${ic("info",16)} ${t("simNote")}</p>
        <div class="actions"><button type="button" class="btn secondary" id="dBack">${ic("chevL",18)} ${t("edit")}</button><button type="button" class="btn primary" id="dGo">${ic("check",18)} ${t("dep.confirm")}</button></div>`;
      $("#dBack",d.el).onclick=()=>{st.step=1;draw();};
      $("#dGo",d.el).onclick=e=>{e.currentTarget.disabled=true;
        const [y,m,dd]=st.date.split("-").map(Number),n=new Date(),date=new Date(y,m-1,dd,n.getHours(),n.getMinutes());
        c.amount=+(c.amount+st.usd).toFixed(6);
        const x={id:uid(),ref:makeRef(date),type:"deposit",name:st.note||st.source,cat:st.source,amount:+st.usd.toFixed(6),fee:0,date,card:c.num,note:st.note};
        S.transactions.push(x);logAct("act.deposit",{amt:money(st.usd),n:c.num});
        notify("deposits",t("n.depT"),t("n.depB",{amt:money(st.usd),card:c.name+" ••"+c.num}));save();d.close();
        homeSel={y:date.getFullYear(),m:date.getMonth()};homeMode="deposits";rerender();toast(t("dep.done",{amt:money(st.usd),card:c.name}),"success");
      };
    }
  };draw();
}

function exportCsv(list,name){
  if(!list.length)return toast(t("err.nothingExport"),"error");

  const rows=[["Date","Reference","Type","Name","Category","Card","Amount ("+curCode()+")","Fee ("+curCode()+")","Total ("+curCode()+")","Note"]].concat(list.map(x=>[x.date.toISOString(),x.ref,x.type,txTitle(x),x.cat,x.card?"****"+x.card:"",conv(x.amount).toFixed(2),conv(x.fee||0).toFixed(2),conv(x.amount+(x.type==="deposit"?0:x.fee||0)).toFixed(2),x.note||""]));
  download(name+".csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\n"),"text/csv");toast(t("csvDone",{n:list.length}),"success");
}

function feeBoxHTML(){

function validateTf(){
  const p=recipById(tf.rid),fee=feeFor(p),c=S.cards[tf.card],a=parseAmount(tf.amount);
  if(a.err)return t(a.err);
  if(a.usd>LIMIT_TX)return t("err.overTx",{limit:money(LIMIT_TX,{d:0})});
  const left=LIMIT_DAY-usedToday();if(a.usd>left)return t("err.overDay",{left:money(Math.max(0,left))});
  if(a.usd+fee>c.amount+1e-9)return t("err.insufficient",{bal:money(c.amount),card:esc(c.name)});
  return "";
}
function findDuplicate(){
  const p=recipById(tf.rid),a=parseAmount(tf.amount);if(a.err)return null;
  return S.transactions.find(x=>x.type==="expense"&&(x.rid===tf.rid||x.name===p.name)&&Math.abs(x.amount-a.usd)<0.005&&(Date.now()-x.date.getTime())<10*60*1000);
}
function tfStep3(){

    ${S.settings.askAuthTransfer?`<p class="help" style="margin-bottom:.5rem">${ic("lock",16)} ${t("tf.authNote")}</p>`:""}
    <div class="actions"><button type="button" class="btn ghost" data-tf="cancel">${t("tf.cancel")}</button><button type="button" class="btn secondary" data-tf="back2">${ic("chevL",18)} ${t("edit")}</button><button type="button" class="btn primary" data-tf="confirm" id="tfGo" ${tf.busy?'disabled aria-disabled="true"':""}>${tf.busy?ic("clock",18)+" "+t("tf.sending"):ic("lock",18)+" "+t("tf.confirm",{amt:money(a.usd+fee)})}</button></div>`;
}
function tfStep4(){
  const r=tf.result;
  if(r&&r.ok){const x=S.transactions.find(y=>y.id===r.id);
    return `<div class="result ok" role="status"><div class="r-ico">${ic("checkCircle",44)}</div><h2 id="tfH" tabindex="-1">${t("tf.okT")}</h2><p>${t("tf.okB",{amt:money(x.amount+x.fee),name:esc(txTitle(x))})}</p></div>

function tfGoto(step){tf.step=step;rerender();const h=$("#tfH");if(h){h.setAttribute("tabindex","-1");h.focus();}$("#tfPanel")?.scrollIntoView({block:"start",behavior:reduceMotion()?"auto":"smooth"});}
AFTER.transfers=()=>{
  const panel=$("#tfPanel");if(!panel)return;
  panel.addEventListener("click",async e=>{
    const rb=e.target.closest("[data-rid]");if(rb){tf.rid=rb.dataset.rid;tf.dupOk=false;tfGoto(2);return;}
    const dl=e.target.closest("[data-delrec]");if(dl){const p=recipById(dl.dataset.delrec);if(await confirmDialog({title:t("tf.removeRecipT"),message:t("tf.removeRecipB",{name:esc(p.name)}),ok:t("remove"),danger:true})){S.recipients=S.recipients.filter(x=>x.id!==p.id);save();renderRecipList();toast(t("tf.recipRemoved"));}return;}
    const qc=e.target.closest("[data-rcat]");if(qc){tf.cat=qc.dataset.rcat;$$("[data-rcat]").forEach(b=>b.setAttribute("aria-pressed",String(b===qc)));renderRecipList();return;}

    if(a==="back1")tfGoto(1);
    else if(a==="back2"){tf.busy=false;tfGoto(2);}
    else if(a==="cancel"){if(await confirmDialog({title:t("tf.cancelT"),message:t("tf.cancelB"),ok:t("tf.cancelYes"),danger:true})){tf=newTransfer();rerender();toast(t("tf.cancelled"));}}

    else if(a==="new"){tf=newTransfer();tfGoto(1);}
    else if(a==="retry"){tf.result=null;tf.busy=false;tfGoto(3);}

function liveTfErr(){const msg=validateTf();setErr("tfAmtErr",msg);markInvalid($("#tfAmt"),!!msg,"tfAmtErr");return msg;}
async function confirmTransfer(){
  if(tf.busy)return;                                     // duplicate-click prevention
  const p=recipById(tf.rid),dup=findDuplicate();
  if(dup&&!tf.dupOk){setErr("dupErr",t("tf.dupNeed"));$("#dupOk").focus();return;}
  const err=validateTf();if(err){tf.result={ok:false,msg:err};return tfGoto(4);}
  const a=parseAmount(tf.amount),fee=feeFor(p);
  if(S.settings.askAuthTransfer){
    const ok=await requireAuth(t("auth.reasonTransfer",{amt:money(a.usd+fee),name:esc(p.name)}));
    if(!ok){tf.result={ok:false,msg:t("tf.failAuth")};logAct("act.tfAuthFail");return tfGoto(4);}
  }
  tf.busy=true;rerender();const key=uid();tf.key=key;
  setTimeout(()=>{
    if(tf.key!==key)return;const c=S.cards[tf.card];const err2=validateTf();
    if(err2){tf.busy=false;tf.result={ok:false,msg:err2};return tfGoto(4);}
    c.amount=+(c.amount-a.usd-fee).toFixed(6);
    const x={id:uid(),ref:makeRef(),type:"expense",name:p.name,cat:p.cat,amount:+a.usd.toFixed(6),fee,date:new Date(),card:c.num,note:tf.note,rid:p.id};
    S.transactions.push(x);logAct("act.transfer",{amt:money(a.usd+fee),name:p.name});
    notify("transfers",t("n.tfT"),t("n.tfB",{amt:money(a.usd+fee),name:p.name,ref:x.ref}));checkLowBalance(c);save();
    tf.busy=false;tf.result={ok:true,id:x.id};tfGoto(4);toast(t("tf.okToast",{amt:money(a.usd+fee),name:p.name}),"success");
  },reduceMotion()?300:900);
}
function openAddRecipient(){

    <div class="field"><label for="arName">${t("ar.name")}</label><input class="input" id="arName" maxlength="40" autocomplete="name"><p class="err" id="arNameErr" hidden></p></div>
    <div class="field"><label for="arAcct">${t("ar.acct")}</label><input class="input" id="arAcct" inputmode="numeric" maxlength="20" aria-describedby="arAcctH" autocomplete="off"><p class="help" id="arAcctH">${t("ar.acctHelp")}</p><p class="err" id="arAcctErr" hidden></p></div>
    <div class="actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn primary" type="submit">${ic("userPlus",18)} ${t("ar.save")}</button></div></form>`});
  $("#arF",d.el).onsubmit=e=>{e.preventDefault();const n=$("#arName",d.el),a=$("#arAcct",d.el);const name=n.value.trim(),acct=a.value.replace(/[\s-]/g,"");
    const ne=name.length<2?t("err.name"):allRecipients().some(p=>p.name.toLowerCase()===name.toLowerCase())?t("err.recipExists"):"";
    const ae=!/^\d{10,16}$/.test(acct)?t("err.acct"):"";
    setErr("arNameErr",ne);markInvalid(n,!!ne,"arNameErr");setErr("arAcctErr",ae);markInvalid(a,!!ae,"arAcctErr");
    if(ne||ae){(ne?n:a).focus();return;}
    const r={id:"c:"+uid(),name,account:acct,person:true,cat:"Transfer",color:"#5b6ee1",custom:true};

}

  <div class="goal-grid">${S.goals.map(g=>{const p=g.target?Math.round(g.saved/g.target*100):0,left=Math.max(0,g.target-g.saved);

      <div class="progress" role="progressbar" aria-label="${esc(g.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(p,100)}" aria-valuetext="${t("goal.pct",{p})}"><span style="width:${Math.min(p,100)}%;background:${g.color}"></span></div>
      <dl><dt>${t("goal.saved")}</dt><dd>${sens(g.saved)}</dd><dt>${t("goal.target")}</dt><dd>${money(g.target)}</dd><dt>${t("goal.left")}</dt><dd>${money(left)}</dd>${g.deadline?`<dt>${t("goal.by")}</dt><dd>${fDate(g.deadline+"T12:00")}</dd>`:""}</dl>

AFTER.goals=()=>{
  const m=$("#main");
  m.onclick=e=>{
    const tp=e.target.closest("[data-tpl]");if(tp){const g=GOAL_TEMPLATES[+tp.dataset.tpl];return openGoalDialog(null,{name:g.name,target:g.target,icon:g.icon});}
    if(e.target.closest("#gAdd"))return openGoalDialog();
    const a=e.target.closest("[data-gadd]");if(a)return openGoalMoney(a.dataset.gadd);
    const ed=e.target.closest("[data-gedit]");if(ed)return openGoalDialog(ed.dataset.gedit);
    const dl=e.target.closest("[data-gdel]");if(dl)return deleteGoal(dl.dataset.gdel);
  };
};
function openGoalDialog(id,pre={}){

    <div class="field"><label for="gDate">${t("goal.dateOpt")}</label><input class="input" type="date" id="gDate" value="${v.deadline||""}" aria-describedby="gDateH"><p class="help" id="gDateH">${t("goal.dateHelp")}</p></div>
    <fieldset class="field"><legend>${t("goal.icon")}</legend><div class="chips">${GOAL_ICONS.map(([k])=>`<label class="swatch"><input type="radio" name="gIcon" value="${k}" ${v.icon===k?"checked":""} aria-label="${t("icon."+k)}"><span style="display:grid;place-items:center;background:var(--soft)">${ic(k,20)}</span></label>`).join("")}</div></fieldset>
    <div class="actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn primary" type="submit">${ic("check",18)} ${g?t("saveChanges"):t("goal.create")}</button></div></form>`});
  $("#gF",d.el).onsubmit=e=>{e.preventDefault();const n=$("#gName",d.el),tg=$("#gTarget",d.el);
    const name=n.value.trim(),a=parseAmount(tg.value);
    const ne=name.length<2?t("err.goalName"):"",te=a.err?t(a.err):(g&&a.usd<g.saved-1e-6?t("err.targetBelow",{amt:money(g.saved)}):"");
    setErr("gNameErr",ne);markInvalid(n,!!ne,"gNameErr");setErr("gTargetErr",te);markInvalid(tg,!!te,"gTargetErr");if(ne||te){(ne?n:tg).focus();return;}
    const icon=$("#gF",d.el).gIcon.value||"target",color=(GOAL_ICONS.find(x=>x[0]===icon)||GOAL_ICONS[5])[1];

    else S.goals.push({id:uid(),name,target:a.usd,saved:0,icon,color,deadline:$("#gDate",d.el).value,created:new Date().toISOString()});
    logAct(g?"act.goalEdit":"act.goalAdd",{name});save();d.close();rerender();toast(g?t("goal.updated"):t("goal.created",{name}),"success");};
}

      <fieldset class="field"><legend>${t("tf.payFrom")}</legend><div class="pay-from">${S.cards.map((c,i)=>`<label class="radio-card"><input type="radio" name="gmCard" value="${i}" ${i===st.card?"checked":""}><span class="rc-txt"><strong>${esc(c.name)}</strong><span class="help">•••• ${esc(c.num)}</span></span><span class="rc-bal">${money(c.amount)}</span></label>`).join("")}</div></fieldset>

        <div class="actions"><button type="button" class="btn secondary" id="gmBack">${ic("chevL",18)} ${t("edit")}</button><button type="button" class="btn primary" id="gmGo">${ic("check",18)} ${t("goal.confirmMove")}</button></div>`;

      $("#gmGo",d.el).onclick=e=>{e.currentTarget.disabled=true;c.amount=+(c.amount-st.usd).toFixed(6);g.saved=+(g.saved+st.usd).toFixed(6);

async function deleteGoal(id){
  const g=S.goals.find(x=>x.id===id);
  if(g.saved>0&&!S.cards.length)return toast(t("goal.needCardReturn"),"error");
  if(g.saved>0){
    const d=openDialog({title:t("goal.delete"),html:`<p class="lead" style="color:var(--ink)">${t("goal.delMoney",{amt:money(g.saved),name:esc(g.name)})}</p><form id="gdF"><fieldset class="field"><legend>${t("goal.returnTo")}</legend><div class="pay-from">${S.cards.map((c,i)=>`<label class="radio-card"><input type="radio" name="gdCard" value="${i}" ${i===0?"checked":""}><span class="rc-txt"><strong>${esc(c.name)}</strong><span class="help">•••• ${esc(c.num)}</span></span></label>`).join("")}</div></fieldset>
      <div class="actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn danger" type="submit">${ic("trash",18)} ${t("goal.delReturn")}</button></div></form>`});
    $("#gdF",d.el).onsubmit=e=>{e.preventDefault();const c=S.cards[+$("#gdF",d.el).gdCard.value];c.amount=+(c.amount+g.saved).toFixed(6);
      S.transactions.push({id:uid(),ref:makeRef(),type:"deposit",name:t("tx.goalReturn",{name:g.name}),cat:"Refund",amount:g.saved,fee:0,date:new Date(),card:c.num,note:""});
      S.goals=S.goals.filter(x=>x!==g);logAct("act.goalDel",{name:g.name});save();d.close();rerender();toast(t("goal.deleted"),"success");};
  }else if(await confirmDialog({title:t("goal.delete"),message:t("goal.delB",{name:esc(g.name)}),ok:t("remove"),danger:true})){S.goals=S.goals.filter(x=>x!==g);logAct("act.goalDel",{name:g.name});save();rerender();toast(t("goal.deleted"),"success");}
}

investments.forEach((v,i)=>{let s=v.val*(1-v.chg/100*3);v.hist=[];let seed=i*97+13;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};for(let k=0;k<29;k++){s*=1+(r()-.48)*.03;v.hist.push(s);}v.hist.push(v.val);v.open=v.val/(1+v.chg/100);});
function investRows(limit){
  return investments.slice(0,limit||investments.length).map(v=>{const up=v.chg>=0;
    return `<div class="inv-row"><span class="badge" style="--c:${v.color}">${ic(v.icon,20)}</span><div><div class="nm">${v.name}</div><div class="tk">${v.tick}</div></div>${sparkSvg(v.hist,up?"var(--pos)":"var(--neg)",104,38)}<div style="text-align:right"><div class="pr">${money(v.val)}</div><div class="chg ${up?"up":"down"}">${ic(up?"up":"downTrend",14,2.4)} ${up?"+":"−"}${Math.abs(v.chg).toFixed(2)}% <span class="sr-only">${up?t("inv.up"):t("inv.down")}</span></div></div></div>`;}).join("");
}
function investSummary(){
  const up=investments.filter(v=>v.chg>=0).length,avg=investments.reduce((a,v)=>a+v.chg,0)/investments.length,best=[...investments].sort((a,b)=>b.chg-a.chg)[0],worst=[...investments].sort((a,b)=>a.chg-b.chg)[0];
  return `<div class="stat"><div class="s-lbl">${t("inv.upDown")}</div><div class="s-val">${t("inv.upOf",{up,n:investments.length})}</div><div class="s-cmp">${t("inv.downN",{n:investments.length-up})}</div></div>
    <div class="stat"><div class="s-lbl">${t("inv.avg")} ${tip("change")}</div><div class="s-val" style="color:${avg>=0?"var(--pos)":"var(--neg)"}">${avg>=0?"+":"−"}${Math.abs(avg).toFixed(2)}%</div><div class="s-cmp">${avg>=0?t("inv.avgUp"):t("inv.avgDown")}</div></div>
    <div class="stat"><div class="s-lbl">${t("inv.best")}</div><div class="s-val">${best.name}</div><div class="s-cmp">${best.chg>=0?"+":"−"}${Math.abs(best.chg).toFixed(2)}%</div></div>
    <div class="stat"><div class="s-lbl">${t("inv.worst")}</div><div class="s-val">${worst.name}</div><div class="s-cmp">${worst.chg>=0?"+":"−"}${Math.abs(worst.chg).toFixed(2)}%</div></div>`;
}

function tickInvest(){

const rp={mode:"month",y:NOWD.getFullYear(),m:NOWD.getMonth(),table:false};
function rpBuckets(){
  if(rp.mode==="year")return [...Array(12)].map((_,m)=>({label:monthName(m,"short"),long:monthName(m)+" "+rp.y,list:periodTx(rp.y,m)}));
  const days=new Date(rp.y,rp.m+1,0).getDate(),list=periodTx(rp.y,rp.m),out=[];
  for(let s=1;s<=days;s+=7){const e=Math.min(s+6,days);out.push({label:s+"–"+e,long:t("rp.week",{n:out.length+1,s,e}),list:list.filter(x=>x.date.getDate()>=s&&x.date.getDate()<=e)});}
  return out;
}
function barChart(b){
  const W=640,H=280,pl=58,pb=36,pt=16,cw=W-pl-12,chh=H-pt-pb;
  const data=b.map(x=>{const s=sums(x.list);return {...x,inc:s.inc,out:s.out};});
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.out)));
  const gw=cw/data.length,bw=Math.min(26,gw/2.8);
  let g="";for(let i=0;i<=4;i++){const y=pt+chh-chh*i/4;g+=`<line x1="${pl}" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${moneyShort(max*i/4)}</text>`;}
  data.forEach((d,i)=>{const cx=pl+gw*i+gw/2,hi=chh*d.inc/max,ho=chh*d.out/max;
    g+=`<rect x="${cx-bw-2}" y="${pt+chh-hi}" width="${bw}" height="${Math.max(hi,d.inc?1:0)}" rx="3" fill="var(--chart-in)"><title>${d.long} — ${t("moneyIn")}: ${money(d.inc)}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${pt+chh-ho}" width="${bw}" height="${Math.max(ho,d.out?1:0)}" rx="3" fill="url(#hatch)" stroke="var(--chart-out)" stroke-width="1.5"><title>${d.long} — ${t("moneyOut")}: ${money(d.out)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">${d.label}</text>`;});
  const ti=data.reduce((a,d)=>a+d.inc,0),to=data.reduce((a,d)=>a+d.out,0);
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("rp.chartAlt",{inc:money(ti),out:money(to)})}"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--chart-out)" opacity=".45"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--chart-out)" stroke-width="3"/></pattern></defs>${g}<line x1="${pl}" x2="${W-8}" y1="${pt+chh}" y2="${pt+chh}" stroke="var(--ink)" stroke-width="1.5"/></svg>`;
  const table=`<table class="data-table"><caption>${t("rp.tableCap")}</caption><thead><tr><th scope="col">${rp.mode==="year"?t("month"):t("rp.weekCol")}</th><th scope="col">${t("moneyIn")}</th><th scope="col">${t("moneyOut")}</th><th scope="col">${t("net")}</th></tr></thead><tbody>${data.map(d=>`<tr><th scope="row">${d.long}</th><td>${money(d.inc)}</td><td>${money(d.out)}</td><td>${money(d.inc-d.out,{sign:true})}</td></tr>`).join("")}</tbody><tfoot><tr><th scope="row">${t("total")}</th><td><strong>${money(ti)}</strong></td><td><strong>${money(to)}</strong></td><td><strong>${money(ti-to,{sign:true})}</strong></td></tr></tfoot></table>`;
  return {svg,table};
}
function pageReports(){

  const ins=[];

    ins.push(s.net>=0?t("ins.saved",{amt:money(s.net),p:plabel}):t("ins.over",{amt:money(-s.net),p:plabel}));

    if(ps.out&&s.out)ins.push(s.out<=ps.out?t("ins.lessThan",{p:Math.round((ps.out-s.out)/ps.out*100)}):t("ins.moreThan",{p:Math.round((s.out-ps.out)/ps.out*100)}));
    if(s.fees)ins.push(t("ins.fees",{amt:money(s.fees)}));
    if(s.sav)ins.push(t("ins.goals",{amt:money(s.sav)}));
  }
