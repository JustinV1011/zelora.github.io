AFTER.settings=()=>{
  const st=S.settings,m=$("#main");
  if(session.scrollTo){const el=document.getElementById(session.scrollTo);session.scrollTo=null;if(el){el.scrollIntoView();el.querySelector("h2")?.setAttribute("tabindex","-1");el.querySelector("h2")?.focus({preventScroll:true});}}
  $$(".set-nav a").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.sec);el.scrollIntoView({behavior:reduceMotion()?"auto":"smooth"});const h=el.querySelector("h2");h.setAttribute("tabindex","-1");h.focus({preventScroll:true});});
  const applyAndRerender=(msg)=>{applyPrefs();save();renderShell();route();toast(msg,"success");};
  m.onchange=async e=>{const el=e.target;
    if(el.name==="font"){st.font=el.value;logAct("act.font",{v:t("font."+el.value)});applyPrefs();save();toast(t("set.fontDone",{v:t("font."+el.value)}),"success");}
    else if(el.name==="theme"){st.theme=el.value;applyPrefs();save();toast(t("set.themeDone"),"success");}
    else if(el.name==="lang"){st.lang=el.value;logAct("act.lang",{v:el.value==="fil"?"Filipino":"English"});session.scrollTo="sec-lang";applyAndRerender(t("set.langDone"));}
    else if(el.name==="cur")setCurrency(el.value);
    else if(el.id==="sContrast"){st.contrast=el.checked;applyPrefs();save();toast(el.checked?t("set.contrastOn"):t("set.contrastOff"),"success");}
    else if(el.id==="sMotion"){st.reduceMotion=el.checked;applyPrefs();save();toast(t("saved"),"success");}
    else if(el.id==="sTips"){st.showTips=el.checked;applyPrefs();save();toast(t("saved"),"success");}
    else if(el.id.startsWith("n")&&el.type==="checkbox"){const map={nTransfers:"transfers",nDeposits:"deposits",nGoals:"goals",nSecurity:"security",nLow:"lowBalance"};
      if(el.id==="nSecurity"&&!el.checked&&!(await confirmDialog({title:t("nt.secOffT"),message:t("nt.secOffB"),ok:t("nt.secOffOk"),danger:true}))){el.checked=true;return;}
      st.notif[map[el.id]]=el.checked;save();toast(t("saved"),"success");}
    else if(el.id.startsWith("dsh-")){st.dash[el.id.slice(4)]=el.checked;save();toast(t("saved"),"success");}
    else if(el.id==="sLock"){st.autoLock=+el.value;logAct("act.autoLock",{n:el.value});save();toast(t("sec.lockSet",{n:el.value}),"success");}
    else if(el.id==="sAskAuth"){if(!el.checked){if(!(await requireAuth(t("auth.reasonSetting")))){el.checked=true;return;}}st.askAuthTransfer=el.checked;logAct(el.checked?"act.askOn":"act.askOff");notify("security",t("n.secChangeT"),el.checked?t("n.askOn"):t("n.askOff"));save();toast(t("saved"),"success");}
    else if(el.id==="sHideDef"){st.hideBalances=el.checked;save();toast(t("saved"),"success");}
    else if(el.id==="sBio"){
      if(el.checked){el.checked=false;if(!(await requireAuth(t("auth.reasonBio"))))return;
        try{st.biometricId=await bioRegister();el.checked=true;logAct("act.bioOn");notify("security",t("n.secChangeT"),t("n.bioOn"));save();toast(t("sec.bioOn"),"success");}catch(err){toast(t("sec.bioErr"),"error");}}
      else{st.biometricId=null;logAct("act.bioOff");notify("security",t("n.secChangeT"),t("n.bioOff"));save();toast(t("sec.bioOff"));}
    }
    else if(el.id==="bkImport"&&el.files[0])importBackup(el.files[0]);
  };
  $("#profF").onsubmit=e=>{e.preventDefault();const n=$("#pName"),em=$("#pEmail"),mo=$("#pMobile");
    const ne=n.value.trim().length<2?t("err.name"):"",ee=em.value.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())?t("err.email"):"",me=mo.value.trim()&&!/^(\+?63|0)9\d{9}$/.test(mo.value.replace(/[\s-]/g,""))?t("err.mobile"):"";
    [[n,ne,"pNameErr"],[em,ee,"pEmailErr"],[mo,me,"pMobileErr"]].forEach(([i,er,id])=>{setErr(id,er);markInvalid(i,!!er,id);});
    if(ne||ee||me){(ne?n:ee?em:mo).focus();return;}
    Object.assign(S.profile,{name:n.value.trim(),email:em.value.trim(),mobile:mo.value.trim()});logAct("act.profile");save();renderShell();route();toast(t("set.profileSaved"),"success");};
  $("#rateF").onsubmit=e=>{e.preventDefault();let bad=false;
    [["PHP","rPHP",1,500],["EUR","rEUR",0.1,5]].forEach(([k,id,min,max])=>{const i=$("#"+id),v=parseFloat(i.value);const er=!(v>=min&&v<=max)?t("err.rate",{min,max}):"";setErr(id+"Err",er);markInvalid(i,!!er,id+"Err");if(er)bad=true;else st.rates[k]=v;});
    if(bad)return;logAct("act.rates");save();rerender();toast(t("set.ratesSaved"),"success");};
  $("#lowF").onsubmit=e=>{e.preventDefault();const i=$("#lowAmt"),a=parseAmount(i.value);const er=a.err?t(a.err):"";setErr("lowErr",er);markInvalid(i,!!er,"lowErr");if(er)return;st.notif.lowBalanceAmt=a.usd;save();toast(t("saved"),"success");};
  const rules=()=>{const r=pwRules($("#pwNew").value);$("#pwRules").innerHTML=[["len","su.r.len"],["letter","su.r.letter"],["num","su.r.num"]].map(([k,l])=>`<li class="${r[k]?"ok":""}">${ic(r[k]?"checkCircle":"info",16)} ${t(l)}<span class="sr-only">: ${r[k]?t("met"):t("notMet")}</span></li>`).join("");};
  $("#pwNew").addEventListener("input",rules);rules();
  $("#pwF").onsubmit=async e=>{e.preventDefault();const c=$("#pwCur").value,n1=$("#pwNew").value,n2=$("#pwNew2").value,r=pwRules(n1);
    let er="";if(!c)er=t("auth.empty");else if(!(await checkPw(c)))er=t("sec.curWrong");else if(!(r.len&&r.letter&&r.num))er=t("su.weak");else if(n1!==n2)er=t("su.mismatch");else if(n1===c)er=t("sec.samePw");
    setErr("pwErr",er);if(er){if(er===t("sec.curWrong"))logAct("act.authFail");return;}
    S.profile.salt=uid()+uid();S.profile.hash=await hashPw(n1,S.profile.salt);logAct("act.pwChanged");notify("security",t("n.pwT"),t("n.pwB"));save();$("#pwF").reset();rules();toast(t("sec.pwDone"),"success");};
  $("#signOutBtn").onclick=()=>lockApp("signout");
  $("#bkImportLbl").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#bkImport").click();}};
  $("#bkExport").onclick=async()=>{if(!(await requireAuth(t("auth.reasonExport"))))return;const d=clone(S);delete d.profile.hash;delete d.profile.salt;download("ZELORA-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(d,null,2),"application/json");logAct("act.export");toast(t("data.exported"),"success");};
  $("#bkReset").onclick=async()=>{
    if(!(await confirmDialog({title:t("data.resetT"),message:t("data.resetB"),ok:t("data.resetOk"),danger:true})))return;
    if(!(await requireAuth(t("auth.reasonReset"))))return;
    try{localStorage.removeItem(STORE);localStorage.removeItem(PREV_STORE);localStorage.removeItem(OLD_STORE);}catch(e){}
    const keep={lang:S.settings.lang,font:S.settings.font,theme:S.settings.theme,contrast:S.settings.contrast};S=freshState();Object.assign(S.settings,keep);session.unlocked=false;applyPrefs();saveNow();renderAuth();toast(t("data.resetDone"),"success");};
};
function importBackup(file){
  const rd=new FileReader();rd.onload=async()=>{
    try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.cards)||!Array.isArray(d.transactions))throw 0;
      if(!(await confirmDialog({title:t("data.importT"),message:t("data.importB",{c:d.cards.length,n:d.transactions.length}),ok:t("data.importOk"),danger:true})))return;
      if(!(await requireAuth(t("auth.reasonImport"))))return;
      ["cards","transactions","goals","recipients"].forEach(k=>S[k]=Array.isArray(d[k])?d[k]:[]);if(d.settings)S.settings=deepMerge(S.settings,{...d.settings,biometricId:S.settings.biometricId});
      normalize();logAct("act.import");save();applyPrefs();renderShell();route();toast(t("data.imported"),"success");}
    catch(e){toast(t("data.importErr"),"error");}
  };rd.readAsText(file);
}

/* =================== AUTH SCREENS =================== */
function a11yBar(){
  return `<div class="a11y-bar" role="group" aria-label="${t("a11y.quick")}">
    <label class="sr-only" for="qLang">${t("set.lang")}</label><select id="qLang" class="pill"><option value="en" ${S.settings.lang==="en"?"selected":""}>English</option><option value="fil" ${S.settings.lang==="fil"?"selected":""}>Filipino</option></select>
    ${["s","m","l"].map(f=>`<button type="button" class="pill" data-qfont="${f}" aria-pressed="${S.settings.font===f}" aria-label="${t("set.font")}: ${t("font."+f)}"><span aria-hidden="true" style="font-size:${f==="s"?".85":f==="m"?"1":"1.2"}rem">A</span></button>`).join("")}
    <button type="button" class="pill" data-qcontrast aria-pressed="${S.settings.contrast}">${ic("contrast",16)} ${t("a11y.contrast")}</button>
    <button type="button" class="pill" data-qdark aria-pressed="${document.documentElement.dataset.theme==="dark"}">${ic("moon",16)} ${t("theme.dark")}</button></div>`;
}
function wireA11yBar(){
  $("#qLang").onchange=e=>{S.settings.lang=e.target.value;saveNow();renderAuth();$("#qLang").focus();};
  $$("[data-qfont]").forEach(b=>b.onclick=()=>{S.settings.font=b.dataset.qfont;applyPrefs();saveNow();renderAuth();$(`[data-qfont="${b.dataset.qfont}"]`).focus();});
  $("[data-qcontrast]").onclick=()=>{S.settings.contrast=!S.settings.contrast;applyPrefs();saveNow();renderAuth();$("[data-qcontrast]").focus();};
  $("[data-qdark]").onclick=()=>{S.settings.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";applyPrefs();saveNow();renderAuth();$("[data-qdark]").focus();};
}
function renderAuth(){
  session.unlocked=false;dialogs.slice().forEach(d=>d.close());
  document.title="ZELORA";applyPrefs();
  if(!S.profile)renderSignup();else renderLogin();
}
function renderSignup(){
  $("#app").innerHTML=`<div class="auth-page">${a11yBar()}<main class="auth-card" aria-labelledby="suH">${logo()}
    <h1 id="suH">${t("su.title")}</h1><p class="sub">${t("su.sub")}</p>
    <form id="suF" novalidate>
      <div class="field"><label for="suName">${t("su.name")}</label><input class="input" id="suName" autocomplete="name" maxlength="40" required><p class="err" id="suNameErr" hidden></p></div>
      <div class="field"><label for="suEmail">${t("su.emailOpt")}</label><input class="input" id="suEmail" type="email" autocomplete="email"><p class="err" id="suEmailErr" hidden></p></div>
      ${pwField("suPw",t("su.pw"),"new-password")}<ul class="pw-rules" id="suRules" aria-live="polite"></ul>
      ${pwField("suPw2",t("su.pw2"),"new-password")}<p class="err" id="suPwErr" role="alert" hidden></p>
      <button class="btn primary block" type="submit" style="margin-top:.5rem">${t("su.create")} ${ic("arrowR",18)}</button>
    </form>
    <p class="auth-note">${ic("shield",18)}<span>${t("su.note")}</span></p></main></div>`;
  wireA11yBar();
  const rules=()=>{const r=pwRules($("#suPw").value);$("#suRules").innerHTML=[["len","su.r.len"],["letter","su.r.letter"],["num","su.r.num"]].map(([k,l])=>`<li class="${r[k]?"ok":""}">${ic(r[k]?"checkCircle":"info",16)} ${t(l)}<span class="sr-only">: ${r[k]?t("met"):t("notMet")}</span></li>`).join("");};
  $("#suPw").addEventListener("input",rules);rules();
  $("#suF").onsubmit=async e=>{e.preventDefault();
    const n=$("#suName"),em=$("#suEmail"),p1=$("#suPw"),p2=$("#suPw2"),r=pwRules(p1.value);
    const ne=n.value.trim().length<2?t("err.name"):"",ee=em.value.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())?t("err.email"):"";
    const pe=!(r.len&&r.letter&&r.num)?t("su.weak"):p1.value!==p2.value?t("su.mismatch"):"";
    setErr("suNameErr",ne);markInvalid(n,!!ne,"suNameErr");setErr("suEmailErr",ee);markInvalid(em,!!ee,"suEmailErr");setErr("suPwErr",pe);markInvalid(p1,!!pe,"suPwErr");
    if(ne||ee||pe){(ne?n:ee?em:p1).focus();return;}
    const salt=uid()+uid();S.profile={name:n.value.trim(),email:em.value.trim(),mobile:"",salt,hash:await hashPw(p1.value,salt),created:new Date().toISOString()};
    logAct("act.created");unlock();notify("security",t("n.welcomeT"),t("n.welcomeB"));
    if(!S.settings.tourDone)setTimeout(()=>startTour(0),300);
  };
}
function renderLogin(){
  const lockedFor=Math.ceil((S.security.lockUntil-Date.now())/1000);
  $("#app").innerHTML=`<div class="auth-page">${a11yBar()}<main class="auth-card" aria-labelledby="liH">${logo()}
    <h1 id="liH">${t("li.title",{name:esc(S.profile.name.split(" ")[0])})}</h1><p class="sub">${session.lockReason?t("li.reason."+session.lockReason):t("li.sub")}</p>
    ${lockedFor>0?`<div class="alert err-box" role="alert">${ic("lock",20)}<p>${t("li.locked",{s:lockedFor})}</p></div>`:""}
    <form id="liF" novalidate>${pwField("liPw",t("auth.password"))}<p class="err" id="liErr" role="alert" hidden></p>
      <button class="btn primary block" type="submit" ${lockedFor>0?"disabled":""}>${ic("lock",18)} ${t("li.signIn")}</button></form>
    ${S.settings.biometricId&&session.bioAvail?`<div class="or">${t("or")}</div><button type="button" class="btn secondary block" id="liBio">${ic("fingerprint",22)} ${t("li.bio")}</button>`:""}
    <div style="text-align:center;margin-top:1rem"><button type="button" class="link" id="liForgot">${t("li.forgot")}</button></div>
    <p class="auth-note">${ic("shield",18)}<span>${t("li.note")}</span></p></main></div>`;
  wireA11yBar();
  if(lockedFor>0)setTimeout(()=>{if(!session.unlocked&&S.profile)renderLogin();},Math.min(lockedFor,5)*1000);
  setTimeout(()=>$("#liPw")?.focus(),50);
  $("#liF").onsubmit=async e=>{e.preventDefault();const i=$("#liPw");
    if(Date.now()<S.security.lockUntil)return renderLogin();
    if(!i.value){setErr("liErr",t("auth.empty"));markInvalid(i,true,"liErr");i.focus();return;}
    if(await checkPw(i.value)){S.security.failed=0;logAct("act.login");unlock();}
    else{S.security.failed++;logAct("act.loginFail");i.value="";markInvalid(i,true,"liErr");
      if(S.security.failed>=5){S.security.lockUntil=Date.now()+30000;S.security.failed=0;notify("security",t("n.lockT"),t("n.lockB"));saveNow();return renderLogin();}
      saveNow();setErr("liErr",t("li.wrong",{n:5-S.security.failed}));i.focus();}
  };
  const bb=$("#liBio");if(bb)bb.onclick=async()=>{if(await bioVerify()){logAct("act.bioLogin");unlock();}else setErr("liErr",t("auth.bioFail"));};
  $("#liForgot").onclick=()=>{
    const d=openDialog({title:t("li.forgotT"),html:`<p class="lead" style="color:var(--ink)">${t("li.forgotB")}</p><form id="fgF" novalidate><div class="field"><label for="fgTxt">${t("li.typeReset")}</label><input class="input" id="fgTxt" autocomplete="off"><p class="err" id="fgErr" hidden></p></div>
      <div class="actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn danger" type="submit">${ic("trash",18)} ${t("data.resetOk")}</button></div></form>`});
    $("#fgF",d.el).onsubmit=e=>{e.preventDefault();if($("#fgTxt",d.el).value.trim().toUpperCase()!=="RESET"){setErr("fgErr",t("li.typeErr"));return;}
      try{localStorage.removeItem(STORE);localStorage.removeItem(PREV_STORE);localStorage.removeItem(OLD_STORE);}catch(x){}const keep={lang:S.settings.lang,font:S.settings.font,theme:S.settings.theme,contrast:S.settings.contrast};S=freshState();Object.assign(S.settings,keep);saveNow();d.close();renderAuth();toast(t("data.resetDone"),"success");};
  };
}
function unlock(){
  session.unlocked=true;session.since=new Date();session.last=Date.now();session.hide=S.settings.hideBalances;session.lockReason=null;
  applyPrefs();saveNow();renderShell();if(!location.hash)location.hash="home";route();
}
function lockApp(reason){
  if(!session.unlocked)return;logAct(reason==="idle"?"act.lockedIdle":reason==="signout"?"act.signout":"act.locked");
  if(reason==="idle")notify("security",t("n.idleT"),t("n.idleB",{n:S.settings.autoLock}));
  session.lockReason=reason;session.unlocked=false;tf.busy=false;saveNow();renderAuth();
}
["pointerdown","keydown","touchstart","scroll"].forEach(ev=>addEventListener(ev,()=>{session.last=Date.now();},{passive:true}));
setInterval(()=>{if(session.unlocked&&Date.now()-session.last>S.settings.autoLock*60000)lockApp("idle");},5000);

/* =================== ONBOARDING TOUR =================== */
const TOUR=[
  {icon:"home",key:"t1",nav:null,setup:true},
  {icon:"wallet",key:"t2",nav:"home"},
  {icon:"card",key:"t3",nav:"accounts"},
  {icon:"send",key:"t4",nav:"transfers"},
  {icon:"chart",key:"t5",nav:"reports"},
  {icon:"gear",key:"t6",nav:"settings"},
];
function startTour(i=0){
  dialogs.slice().forEach(d=>d.close());
  const s=TOUR[i];$$(".tour-hl").forEach(e=>e.classList.remove("tour-hl"));
  if(s.nav)$$(`[data-nav="${s.nav}"]`).forEach(e=>e.classList.add("tour-hl"));
  if(s.nav&&innerWidth<=720&&["reports","settings"].includes(s.nav))$$('[data-nav="more"]').forEach(e=>e.classList.add("tour-hl"));
  const body=`<div class="tour-body"><div class="tour-ico">${ic(s.icon,36)}</div><p>${t("tour."+s.key+".b",{name:esc((S.profile?.name||"").split(" ")[0])})}</p>
    ${I18N["tour."+s.key+".l"]?`<ul>${t("tour."+s.key+".l").split("|").map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
    ${s.nav?`<p class="help">${ic("info",16)} ${t("tour.where",{place:t("nav."+s.nav)})}</p>`:""}
    ${s.setup?`<fieldset class="field" style="margin-top:1rem"><legend>${t("tour.pickFont")}</legend><div class="opt-grid">${opt("tFont","s",S.settings.font,t("font.s"))}${opt("tFont","m",S.settings.font,t("font.m"))}${opt("tFont","l",S.settings.font,t("font.l"))}</div></fieldset>
      <fieldset class="field"><legend>${t("set.lang")}</legend><div class="opt-grid">${opt("tLang","en",S.settings.lang,"English")}${opt("tLang","fil",S.settings.lang,"Filipino")}</div></fieldset>`:""}</div>
    <div class="tour-dots" aria-hidden="true">${TOUR.map((_,k)=>`<span class="${k===i?"on":""}"></span>`).join("")}</div><p class="help" style="text-align:center">${t("stepOf",{n:i+1,total:TOUR.length})}</p>
    <div class="actions">${i===0?`<button type="button" class="btn ghost" id="tSkip">${t("tour.skip")}</button>`:`<button type="button" class="btn secondary" id="tBack">${ic("chevL",18)} ${t("back")}</button>`}
    <button type="button" class="btn primary" id="tNext">${i===TOUR.length-1?ic("check",18)+" "+t("tour.done"):t("next")+" "+ic("arrowR",18)}</button></div>`;
  const d=openDialog({title:t("tour."+s.key+".t",{name:esc((S.profile?.name||"").split(" ")[0])}),html:body,onClose:r=>{$$(".tour-hl").forEach(e=>e.classList.remove("tour-hl"));if(r!=="nav"){S.settings.tourDone=true;save();}}});
  if(s.setup){$$("[name=tFont]",d.el).forEach(r=>r.onchange=()=>{S.settings.font=r.value;applyPrefs();save();});
    $$("[name=tLang]",d.el).forEach(r=>r.onchange=()=>{S.settings.lang=r.value;applyPrefs();save();renderShell();route();d.close("nav");startTour(0);});}
  $("#tNext",d.el).onclick=()=>{if(i===TOUR.length-1){d.close();toast(t("tour.finished"),"success");}else{d.close("nav");startTour(i+1);}};
  const b=$("#tBack",d.el);if(b)b.onclick=()=>{d.close("nav");startTour(i-1);};
  const sk=$("#tSkip",d.el);if(sk)sk.onclick=()=>{d.close();toast(t("tour.skipped"));};
  setTimeout(()=>$("#tNext",d.el).focus(),60);
}

/* =================== INIT =================== */
async function init(){
  load();applyPrefs();
  mqDark.addEventListener?.("change",()=>{applyPrefs();});mqMotion.addEventListener?.("change",applyPrefs);
  session.bioAvail=await bioAvailable();
  renderAuth();
  setInterval(tickInvest,5000);
}
init();

</script>
